<style>
    #graphcomment {
    min-height: 341px;
    background:
#100E0C;
    color-scheme: dark;
  }
  @media (min-width: 501px) { #graphcomment { min-height: 304px; } }
  @media (min-width: 600px) { #graphcomment { min-height: 286px; } }
  #graphcomment {
    position: relative;
    overflow: hidden;
}
   #graphcomment::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 70px;           /* covers Rules / Privacy / Report a bug / logo */
    background:
#100E0C;    /* same as your site background */
    pointer-events: none;
}
   .gc-section {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid #33302A;
  }
  .gc-heading {
    font-family: var(--font-display, "Fraunces", serif);
    font-weight: 600;
    font-size: 1.5rem;
    color: #EDE6D8;
    margin: 0 0 1rem;
  }
</style>

<section class="gc-section">
  <h2 class="gc-heading">Comments</h2>
  <div id="graphcomment"></div>
</section>

<script type="text/javascript">

  /* - - - CONFIGURATION VARIABLES - - - */

  var __semio__params = {
    graphcommentId: "Rajat-K-R",

    behaviour: {
      uid: "{{ .RelPermalink }}",
    },

    integration: {
      theme: "dark",
      font: "Inter",
    },
  }

  // Runs once the widget has loaded: apply site colors
  window.onGcLoaded = function () {
    __semio__gcDarkTheme('warm', '#3F7566')  // palette + moss accent
    __semio__gcSetDarkBg('#100E0C')          // ink background
  }

  /* - - - DON'T EDIT BELOW THIS LINE - - - */

  function __semio__onload() {
    __semio__gc_graphlogin(__semio__params)
  }

  (function() {
    var gc = document.createElement('script'); gc.type = 'text/javascript'; gc.async = true;
    gc.onload = __semio__onload; gc.defer = true; gc.src = 'https://integration.graphcomment.com/gc_graphlogin.js?' + Date.now();
    (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(gc);
  })();

</script>
